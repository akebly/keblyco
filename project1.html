<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>فيلا راقية | قبلي للتصميم الداخلي</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" href="css/style.css">
	<style>
		/* Disable image dragging and right-click */
		img {
			user-drag: none;
			-webkit-user-drag: none;
			user-select: none;
			-moz-user-select: none;
			-webkit-user-select: none;
			-ms-user-select: none;
			pointer-events: none;
		}
		.project-gallery {
			margin-top: 2rem;
		}
		.project-gallery img {
			width: 100%;
			height: auto;
			margin-bottom: 1rem;
			cursor: pointer;
			transition: transform 0.3s ease;
		}
		.project-gallery img:hover {
			transform: scale(1.02);
		}
		.project-info {
			padding: 2rem 0;
		}
		.back-to-projects {
			margin-bottom: 2rem;
		}
		.lightbox {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.9);
			z-index: 1000;
		}
		.lightbox-content {
			max-width: 90%;
			max-height: 90vh;
			margin: auto;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
		.lightbox img {
			max-width: 100%;
			max-height: 90vh;
			object-fit: contain;
		}
		.close-lightbox {
			position: absolute;
			top: 20px;
			right: 20px;
			color: white;
			font-size: 2rem;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<!-- Navbar -->
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container">
			<a class="navbar-brand" href="index.html">
				<img src="images/logo/logo-ar.png" alt="قبلي للتصميم الداخلي" class="navbar-logo">
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link" href="index.html">الرئيسية</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="index.html#projects">المشاريع</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- Project Content -->
	<div class="container">
		<div class="back-to-projects">
			<a href="index.html#projects" class="btn btn-outline-primary">
				<i class="fas fa-arrow-right me-2"></i>العودة للمشاريع
			</a>
		</div>

		<div class="project-info">
			<h1>فيلا راقية</h1>
			<p class="lead">تصميم داخلي فاخر يجمع بين الأناقة والراحة</p>
			<p>تم تنفيذ هذا المشروع في منطقة راقية، حيث قمنا بتصميم وتنفيذ مساحات داخلية فاخرة تعكس الذوق الرفيع وتوفر أقصى درجات الراحة والرفاهية.</p>
		</div>

		<div class="project-gallery">
			<div class="row">
				<div class="col-md-6 mb-4">
					<img src="images/projects/project1.jpg" alt="فيلا راقية - الصورة الرئيسية" class="img-fluid no-drag" onclick="openLightbox(this)">
				</div>
				<div class="col-md-6 mb-4">
					<img src="images/projects/project1-2.jpg" alt="فيلا راقية - الصورة 2" class="img-fluid no-drag" onclick="openLightbox(this)">
				</div>
				<div class="col-md-6 mb-4">
					<img src="images/projects/project1-3.jpg" alt="فيلا راقية - الصورة 3" class="img-fluid no-drag" onclick="openLightbox(this)">
				</div>
				<div class="col-md-6 mb-4">
					<img src="images/projects/project1-4.jpg" alt="فيلا راقية - الصورة 4" class="img-fluid no-drag" onclick="openLightbox(this)">
				</div>
				<div class="col-md-6 mb-4">
					<img src="images/projects/project1-5.jpg" alt="فيلا راقية - الصورة 5" class="img-fluid no-drag" onclick="openLightbox(this)">
				</div>
				<div class="col-md-6 mb-4">
					<img src="images/projects/project1-6.jpg" alt="فيلا راقية - الصورة 6" class="img-fluid no-drag" onclick="openLightbox(this)">
				</div>
			</div>
		</div>
	</div>

	<!-- Lightbox -->
	<div class="lightbox" onclick="closeLightbox()">
		<span class="close-lightbox" onclick="closeLightbox()">&times;</span>
		<div class="lightbox-content">
			<img src="" alt="">
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function openLightbox(img) {
			const lightbox = document.querySelector('.lightbox');
			const lightboxImg = lightbox.querySelector('img');
			lightboxImg.src = img.src;
			lightboxImg.alt = img.alt;
			lightbox.style.display = 'block';
			document.body.style.overflow = 'hidden';
		}

		function closeLightbox() {
			const lightbox = document.querySelector('.lightbox');
			lightbox.style.display = 'none';
			document.body.style.overflow = '';
		}

		// Close lightbox with Escape key
		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape') {
				closeLightbox();
			}
		});
	</script>
</body>
</html>
